services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # COMPOSE_PROJECT_NAME (set in .env) names this instance; it also scopes the volume and network.
    container_name: ${COMPOSE_PROJECT_NAME:-drop}-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DROP_PIN=${DROP_PIN:?Set DROP_PIN to a 6-digit PIN in .env}
      - JWT_SECRET=${JWT_SECRET:-}
      - TOKEN_DAYS=${TOKEN_DAYS:-30}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
      # Number of proxies in front of the server: 1 = the bundled nginx. Use 2 if you add your own reverse proxy.
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - drop-data:/app/data
    networks:
      - drop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-drop}-client
    ports:
      - "${DROP_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - drop-network
    restart: unless-stopped

volumes:
  drop-data:

networks:
  drop-network:
    driver: bridge
